name: Publish to Docker Hub

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reusable integration suite (unit + integration + playwright). Gates the
  # docker job below. Shared with publish.yml so both deploy paths run the
  # same suite before shipping.
  integration:
    uses: ./.github/workflows/_integration.yml

  docker:
    name: Build and push tuongaz/seeflow to Docker Hub
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          tag="${GIT_REF#refs/tags/v}"
          pkg=$(node -p "require('./apps/studio/package.json').version")
          echo "Tag version: $tag"
          echo "Package version: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "ERROR: tag v$tag does not match apps/studio/package.json version $pkg" >&2
            echo "Bump apps/studio/package.json to $tag, commit, then re-tag." >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tuongaz/seeflow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
