name: Release

# Single release pipeline: tests gate two parallel publish jobs (npm + Docker
# Hub). Replaces the prior split between publish.yml and docker.yml so a
# tagged release only runs the test suite once.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  tests:
    name: Unit + integration (bun + playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Run unit tests first so a fast suite failure short-circuits the slower
      # integration tier. `bun run test:it` only runs the integration files
      # under apps/studio/integration/ + the playwright e2e tier — it does not
      # repeat `bun test`, so we add it explicitly here.
      - name: Unit tests
        env:
          CI: 'true'
        run: bun test

      - name: Integration tests (bun + playwright)
        env:
          CI: 'true'
        run: bun run test:it

      - name: Upload integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: apps/studio/integration/.artifacts/
          retention-days: 7
          if-no-files-found: ignore

  publish-npm:
    name: Publish @tuongaz/seeflow to npm
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          tag="${GIT_REF#refs/tags/v}"
          pkg=$(node -p "require('./apps/studio/package.json').version")
          echo "Tag version: $tag"
          echo "Package version: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "ERROR: tag v$tag does not match apps/studio/package.json version $pkg" >&2
            echo "Bump apps/studio/package.json to $tag, commit, then re-tag." >&2
            exit 1
          fi

      - name: Publish to npm with provenance
        working-directory: apps/studio
        # `prepublishOnly` (in apps/studio/package.json) vendors the tailwind
        # runtime, builds the web bundle into dist/web, and stages the README,
        # so we don't need explicit build/stage steps here.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          tag="${GIT_REF#refs/tags/v}"
          echo "Published @tuongaz/seeflow@${tag} to https://www.npmjs.com/package/@tuongaz/seeflow" >> "$GITHUB_STEP_SUMMARY"

  publish-docker:
    name: Build and push tuongaz/seeflow to Docker Hub
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          tag="${GIT_REF#refs/tags/v}"
          pkg=$(node -p "require('./apps/studio/package.json').version")
          echo "Tag version: $tag"
          echo "Package version: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "ERROR: tag v$tag does not match apps/studio/package.json version $pkg" >&2
            echo "Bump apps/studio/package.json to $tag, commit, then re-tag." >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tuongaz/seeflow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
