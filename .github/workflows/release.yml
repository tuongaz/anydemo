name: Release

# Single release pipeline: optionally bumps the version + tags (workflow_dispatch),
# then runs tests and the two parallel publish jobs (npm + Docker Hub). On a tag
# push the bump step is skipped — useful for re-running the publish jobs against
# an already-tagged release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (patch, minor, or major)'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # prepare-release commits the bump + pushes the tag
  id-token: write # required for npm provenance

jobs:
  prepare-release:
    name: Bump version, commit, and tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Bump apps/studio/package.json
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          PKG=apps/studio/package.json
          OLD=$(node -p "require('./$PKG').version")
          NEW=$(node -e "
            const [a,b,c]=process.argv[1].split('.').map(Number);
            const t=process.argv[2];
            const v = t==='major' ? [a+1,0,0] : t==='minor' ? [a,b+1,0] : [a,b,c+1];
            console.log(v.join('.'));
          " "$OLD" "$BUMP")
          echo "Bumping $OLD -> $NEW"
          node -e "
            const fs=require('fs');
            const path='./apps/studio/package.json';
            const p=JSON.parse(fs.readFileSync(path));
            p.version=process.argv[1];
            fs.writeFileSync(path, JSON.stringify(p,null,'\t')+'\n');
          " "$NEW"
          bun run format
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        env:
          NEW: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/package.json
          git commit -m "chore: bump version to $NEW"
          git push origin "HEAD:$BRANCH"
          git tag "v$NEW"
          git push origin "v$NEW"

  tests:
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    uses: ./.github/workflows/_tests.yml
    with:
      ref: ${{ needs.prepare-release.outputs.tag || github.ref }}

  publish-npm:
    name: Publish @tuongaz/seeflow to npm
    runs-on: ubuntu-latest
    needs: [prepare-release, tests]
    if: always() && needs.tests.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        env:
          REF: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
        run: |
          tag="${REF#refs/tags/}"
          tag="${tag#v}"
          pkg=$(node -p "require('./apps/studio/package.json').version")
          echo "Tag version: $tag"
          echo "Package version: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "ERROR: tag v$tag does not match apps/studio/package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish to npm with provenance
        working-directory: apps/studio
        # `prepublishOnly` (in apps/studio/package.json) vendors the tailwind
        # runtime, builds the web bundle into dist/web, and stages the README,
        # so we don't need explicit build/stage steps here.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        env:
          REF: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
        run: |
          tag="${REF#refs/tags/}"
          tag="${tag#v}"
          echo "Published @tuongaz/seeflow@${tag} to https://www.npmjs.com/package/@tuongaz/seeflow" >> "$GITHUB_STEP_SUMMARY"

  publish-docker:
    name: Build and push tuongaz/seeflow to Docker Hub
    runs-on: ubuntu-latest
    needs: [prepare-release, tests]
    if: always() && needs.tests.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag || github.ref }}

      - name: Verify tag matches package version
        env:
          REF: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
        run: |
          tag="${REF#refs/tags/}"
          tag="${tag#v}"
          pkg=$(node -p "require('./apps/studio/package.json').version")
          echo "Tag version: $tag"
          echo "Package version: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "ERROR: tag v$tag does not match apps/studio/package.json version $pkg" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tuongaz/seeflow
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare-release.outputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare-release.outputs.tag || github.ref_name }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
