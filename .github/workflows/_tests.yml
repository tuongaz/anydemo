name: Tests (reusable)

# Reusable test tier called by release.yml. Kept as its own workflow so the
# gate can be reused by any future caller without duplicating the steps.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (branch, tag, or sha). Defaults to the caller workflow ref.'
        type: string
        required: false
        default: ''

jobs:
  tests:
    name: Unit + integration (bun + playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Cheapest gate in the tier — fail before spending time on install +
      # browser download when the plugin's vendored schema has drifted from
      # apps/studio/src/schema.ts.
      - name: Verify vendored schema is in sync
        run: make verify-seeflow-schema-sync

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # apps/studio imports @seeflow/canvas/catalog whose type declarations
      # live in packages/canvas/dist/catalog.d.ts (build artifact, gitignored).
      # Build canvas before typecheck so studio can resolve the import.
      - name: Build @seeflow/canvas
        run: bun run --filter @seeflow/canvas build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        # Run from apps/studio so bunx resolves the workspace-pinned
        # @playwright/test. From the repo root bunx falls through to the npm
        # registry and pulls a newer playwright whose browser version
        # (chromium-1228) no longer matches the locked test runner (1.60.0 →
        # chromium-1223), leaving the test process pointing at a deleted
        # chrome-headless-shell binary.
        working-directory: apps/studio
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Run unit tests first so a fast suite failure short-circuits the slower
      # integration tier. `bun run test:it` only runs the integration files
      # under apps/studio/integration/ + the playwright e2e tier — it does not
      # repeat `bun test`, so we add it explicitly here.
      - name: Unit tests
        env:
          CI: 'true'
        run: bun test

      - name: Integration tests (bun + playwright)
        env:
          CI: 'true'
          # Skip visual-baseline (screenshot) comparisons so they never block the
          # test/deploy pipeline. Functional e2e still runs. Regenerate baselines
          # locally with `bun run test:it:update-snapshots` (env unset there).
          SEEFLOW_IGNORE_SNAPSHOTS: '1'
        run: bun run test:it

      - name: Debug — list Playwright artifact dirs on failure
        if: failure()
        continue-on-error: true
        run: |
          echo "=== apps/studio/integration/.artifacts/ ==="
          find apps/studio/integration/.artifacts/ -type f 2>/dev/null | head -100 || echo "(missing)"
          echo "=== apps/studio/e2e/playwright-report/ ==="
          ls -la apps/studio/e2e/playwright-report/ 2>/dev/null || echo "(missing)"
          echo "=== visual diff PNGs ==="
          find apps/studio/e2e -type f \( -name "*-actual.png" -o -name "*-diff.png" \) 2>/dev/null | head -50 || echo "(none)"

      - name: Upload integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: |
            apps/studio/integration/.artifacts/
            apps/studio/e2e/playwright-report/
            apps/studio/e2e/**/*-actual.png
            apps/studio/e2e/**/*-diff.png
          retention-days: 7
          if-no-files-found: ignore
