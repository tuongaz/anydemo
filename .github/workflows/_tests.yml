name: Tests (reusable)

# Reusable test tier shared by release.yml and deploy-viewer.yml. Keeping a
# single copy avoids drift between the tag-driven release pipeline and the
# canvas-change-driven viewer-deploy pipeline.
on:
  workflow_call:

jobs:
  tests:
    name: Unit + integration (bun + playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # apps/studio imports @seeflow/canvas/catalog whose type declarations
      # live in packages/canvas/dist/catalog.d.ts (build artifact, gitignored).
      # Build canvas before typecheck so studio can resolve the import.
      - name: Build @seeflow/canvas
        run: bun run --filter @seeflow/canvas build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Run unit tests first so a fast suite failure short-circuits the slower
      # integration tier. `bun run test:it` only runs the integration files
      # under apps/studio/integration/ + the playwright e2e tier — it does not
      # repeat `bun test`, so we add it explicitly here.
      - name: Unit tests
        env:
          CI: 'true'
        run: bun test

      - name: Integration tests (bun + playwright)
        env:
          CI: 'true'
        run: bun run test:it

      - name: Upload integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: apps/studio/integration/.artifacts/
          retention-days: 7
          if-no-files-found: ignore
