name: Build Canvas Dist

on:
  push:
    branches:
      - main
    paths:
      - 'packages/canvas/src/**'
      - 'packages/canvas/tailwind.config.cjs'
      - 'packages/canvas/postcss.config.cjs'
      - 'packages/canvas/tsup.config.ts'
      - 'packages/canvas/package.json'
      - 'bun.lock'
      - '.github/workflows/build-canvas.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-canvas:
    name: Build @seeflow/canvas and commit dist/
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build canvas
        run: bun run --filter @seeflow/canvas build

      - name: Commit and push dist if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/canvas/dist
          if git diff --cached --quiet; then
            echo "packages/canvas/dist unchanged, skipping commit"
            exit 0
          fi
          git commit -m "build: rebuild canvas dist [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push failed on attempt $attempt, rebasing onto origin/main and retrying"
            git pull --rebase origin main
          done
          echo "push failed after 5 attempts"
          exit 1
