name: Build Web Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build apps/web and commit dist/web
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (studio UI)
        run: cd apps/web && bun run build

      - name: Commit and push dist/web if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/studio/dist/web
          if git diff --cached --quiet; then
            echo "dist/web unchanged, skipping commit"
            exit 0
          fi
          git commit -m "build: rebuild dist/web [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push failed on attempt $attempt, rebasing onto origin/main and retrying"
            git pull --rebase origin main
          done
          echo "push failed after 5 attempts"
          exit 1
