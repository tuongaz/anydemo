name: Build Web Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build apps/web and commit dist/web
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (studio UI)
        run: cd apps/web && bun run build

      - name: Commit and push dist/web if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/studio/dist/web
          if git diff --cached --quiet; then
            echo "dist/web unchanged, skipping commit"
          else
            git commit -m "build: rebuild dist/web [skip ci]"
            git push
          fi
