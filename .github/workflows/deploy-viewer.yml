name: Deploy seeflow-viewer

# Triggers the sibling tuongaz/seeflow-viewer repo's deploy.yml whenever
# changes to packages/canvas/ land on main. seeflow-viewer consumes the
# canvas package via `file:../seeflow/packages/canvas`, so canvas changes
# need a viewer rebuild to reach production at https://seeflow.dev.
#
# Tests run first via the reusable _tests.yml; the dispatch only fires if
# they pass. workflow_dispatch is kept so a maintainer can manually
# re-trigger the chain (e.g. backfilling after a missed window).
on:
  push:
    branches: [main]
    paths:
      - 'packages/canvas/**'
  workflow_dispatch:

concurrency:
  group: deploy-viewer
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/_tests.yml

  trigger-viewer-deploy:
    name: Dispatch seeflow-viewer deploy
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Trigger viewer deploy.yml
        env:
          # PAT scoped to tuongaz/seeflow-viewer with Actions: read & write.
          # secrets.GITHUB_TOKEN cannot trigger workflows in a sibling repo,
          # so a fine-grained PAT is required.
          GH_TOKEN: ${{ secrets.VIEWER_DISPATCH_TOKEN }}
        run: |
          gh workflow run deploy.yml \
            --repo tuongaz/seeflow-viewer \
            --ref main

      - name: Summary
        env:
          SHA: ${{ github.sha }}
        run: |
          echo "Triggered seeflow-viewer deploy.yml (commit ${SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
          echo "Track progress: https://github.com/tuongaz/seeflow-viewer/actions/workflows/deploy.yml" >> "$GITHUB_STEP_SUMMARY"
