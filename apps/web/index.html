<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>SeeFlow Studio</title>
    <script>
      // FOUC guard: applies the resolved theme to <html> before React boots.
      // Priority: URL `?theme=` (viewer / embed iframe) > localStorage (studio)
      // > 'system' (matchMedia). When the URL carries `?theme=` with an
      // invalid value (e.g. `?theme=foo` or empty), falls through to 'light' —
      // the new package default per US-010 — instead of probing localStorage,
      // because an explicit-but-invalid param is an embed-side signal.
      // Keep storage key and media query in sync with apps/web/src/hooks/use-theme.ts.
      (function () {
        try {
          var urlTheme = null;
          var hasUrlParam = false;
          try {
            var params = new URLSearchParams(window.location.search);
            if (params.has('theme')) {
              hasUrlParam = true;
              var raw = params.get('theme');
              if (raw === 'light' || raw === 'dark') urlTheme = raw;
            }
          } catch (_) {}
          var resolved = null;
          if (urlTheme) {
            resolved = urlTheme;
          } else if (hasUrlParam) {
            resolved = 'light';
          } else {
            var stored = null;
            try {
              stored = localStorage.getItem('seeflow:theme');
            } catch (_) {}
            var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
            if (theme === 'system') {
              resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } else {
              resolved = theme;
            }
          }
          var cls = document.documentElement.classList;
          if (resolved === 'dark') {
            cls.add('dark');
            cls.remove('light');
          } else {
            cls.add('light');
            cls.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
